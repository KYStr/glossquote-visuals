name: M07 isolated art preview
on:
  push:
    branches: [codex/m07-art-preview]
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        work: [V009, V010]
        lang: [zh-Hant, en]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/vite/bin/vite.js build --mode candidate
      - run: node node_modules/playwright/cli.js install chromium --no-shell
      - run: node test/browser/m07-perf-preview.mjs ${{ matrix.work }} ${{ matrix.lang }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: preview-${{ github.sha }}-${{ matrix.work }}-${{ matrix.lang }}
          path: .runs/art-preview/
          retention-days: 2

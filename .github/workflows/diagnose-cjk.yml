name: Diagnose cold TC first paint
on:
  push:
    branches: ['codex/diagnose-cjk-cold-v007']
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, single-font, font-ready, two-font-ready, zh-browser]
        sample: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node node_modules/playwright/cli.js install chromium --no-shell
          node test/browser/diagnose-cjk.mjs "${{ matrix.mode }}" "${{ matrix.sample }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cjk-${{ matrix.mode }}-${{ matrix.sample }}
          path: .runs/diagnosis/
          if-no-files-found: warn
          retention-days: 7

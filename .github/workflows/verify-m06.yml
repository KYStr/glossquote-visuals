name: Verify M06 candidate

on:
  push:
    branches: ['codex/m06-hero-craft']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  evidence:
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        work: [V008, V009, V010]
        lang: [zh-Hant, en]
        viewport: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate and build candidate
        run: |
          set -o pipefail
          mkdir -p .runs/m06-evidence
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run build | tee .runs/m06-evidence/build.txt
      - run: node node_modules/playwright/cli.js install chromium --no-shell
      - name: Capture page, WebGPU submissions and customer flow
        run: node test/browser/m04-candidate.mjs "${{ matrix.work }}" "${{ matrix.lang }}" "${{ matrix.viewport }}" m06
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: m06-${{ github.sha }}-${{ matrix.work }}-${{ matrix.lang }}-${{ matrix.viewport }}
          path: .runs/m06-evidence/
          if-no-files-found: warn
          retention-days: 7
  accepted:
    name: All M06 candidate checks
    if: always()
    needs: evidence
    runs-on: windows-2025
    steps:
      - env:
          MATRIX_RESULT: ${{ needs.evidence.result }}
        run: test "$MATRIX_RESULT" = 'success'

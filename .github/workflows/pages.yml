name: Publish accepted visuals

on:
  workflow_dispatch:
    inputs:
      work:
        description: Reviewed work IDs from the registry, comma-separated for a batch
        type: string
        required: true
      source_commit:
        description: Exact approved main SHA
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'KYStr/glossquote-visuals' && github.ref == 'refs/heads/main' && github.sha == inputs.source_commit
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GQ_RELEASE_WORK: ${{ inputs.work }}
      GQ_RELEASE_SHA: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run build -- release
      - run: node node_modules/playwright/cli.js install chromium --no-shell
      - run: npm run test:browser -- --shared
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-build-${{ github.sha }}
          path: .runs/browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
  live:
    needs: deploy
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GQ_RELEASE_WORK: ${{ inputs.work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/playwright/cli.js install chromium --no-shell
      - run: npm run test:browser -- --live
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-live-${{ github.sha }}
          path: .runs/browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

name: Verify visual candidate

on:
  push:
    branches: ['codex/v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run build
      - run: node node_modules/playwright/cli.js install --with-deps chromium --no-shell
      - name: Test WebGPU in the isolated Linux VM
        run: |
          if DEBUG=pw:browser npm run test:browser; then
            exit 0
          fi
          if ! compgen -G '/usr/share/vulkan/icd.d/lvp*.json' >/dev/null || ! command -v xvfb-run || ! command -v xauth; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb xauth
          fi
          drivers=(/usr/share/vulkan/icd.d/lvp*.json)
          test -f "${drivers[0]}"
          VK_DRIVER_FILES="${drivers[0]}" GQ_BROWSER_DISPLAY=xvfb DEBUG=pw:browser xvfb-run -a npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual-candidate-${{ github.sha }}
          path: .runs/browser-evidence/
          if-no-files-found: ignore
          retention-days: 7

name: Verify PRISM candidate

on:
  push:
    branches: ['codex/v004-prism-materials']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prism:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run build
      - run: node node_modules/playwright/cli.js install chromium --no-shell
      - name: Verify bilingual sampling and visible optics
        env:
          DEBUG: pw:browser
        run: node test/browser/prism-candidate.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prism-candidate-${{ github.sha }}-Windows
          path: .runs/prism-evidence/
          if-no-files-found: ignore
          retention-days: 7

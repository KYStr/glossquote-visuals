name: Verify deployed visuals

on:
  workflow_dispatch:
    inputs:
      deployed_commit:
        description: Exact already-deployed source SHA, separately recorded from this verifier
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  live:
    if: github.repository == 'KYStr/glossquote-visuals' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GQ_RELEASE_WORK: V001,V002,V003,V004,V005
      GQ_DEPLOYED_SHA: ${{ inputs.deployed_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/playwright/cli.js install chromium --no-shell
      - run: npm run test:browser -- --live
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deployed-live-${{ github.sha }}
          path: .runs/browser-evidence/
          if-no-files-found: error
          retention-days: 7

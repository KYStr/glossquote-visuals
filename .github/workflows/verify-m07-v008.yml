name: Capture V008 M07 author evidence

on:
  push:
    branches: [codex/m07-v008-jelly-hour]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - input: mouse
            lang: en
          - input: mouse
            lang: zh-Hant
          - input: touch
            lang: zh-Hant
          - input: keyboard
            lang: zh-Hant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node node_modules/playwright/cli.js install chromium --no-shell
      - run: node evidence/V008/verify-m07.mjs ${{ matrix.input }} ${{ matrix.lang }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: m07-v008-${{ github.sha }}-${{ matrix.lang }}-${{ matrix.input }}
          path: .runs/m07-v008/
          if-no-files-found: warn
